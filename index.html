<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady Ground</title>
<meta name="description" content="CBT skills, symptom tracking and a self-paced course for functional neurological disorder.">
<meta name="theme-color" content="#2D6878" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F171B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Steady Ground">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--APP-->
<div class="wrap">
  <header class="top" id="header">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="4" y="9" width="32" height="6" rx="3"/>
      <rect x="8" y="19" width="24" height="6" rx="3" opacity=".6"/>
      <rect x="12" y="29" width="16" height="6" rx="3" opacity=".35"/>
    </svg>
    <div>
      <div class="brand">Steady Ground</div>
      <div class="brand-sub">CBT skills for functional neurological disorder</div>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabs" id="tabs" aria-label="Main sections">
  <div class="tabs-in">
    <button type="button" class="tab" data-action="tab" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18M6 17a6 6 0 0 1 12 0M12 5v3M4.5 9.5l2 2M19.5 9.5l-2 2"/></svg>Today
    </button>
    <button type="button" class="tab" data-action="tab" data-tab="track">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h10l3 3v13H6zM9 11h7M9 15h5"/></svg>Track
    </button>
    <button type="button" class="tab" data-action="tab" data-tab="tools">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>Tools
    </button>
    <button type="button" class="tab" data-action="tab" data-tab="course">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6 4.5 9 4.5 12 6c3-1.5 6-1.5 8-.5V19c-2-1-5-1-8 .5-3-1.5-6-1.5-8-.5zM12 6v13.5"/></svg>Course
    </button>
    <button type="button" class="tab" data-action="tab" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M7 15l4-5 3 3 5-7"/></svg>Progress
    </button>
    <button type="button" class="tab" data-action="tab" data-tab="me">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me
    </button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="jspdf.umd.min.js"></script>
<script src="course.js"></script>
<script src="app.js"></script>
<!--/APP-->
</body>
</html>
